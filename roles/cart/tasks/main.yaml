- name: app setup
  ansible.builtin.import_role:
    name: common 
    tasks_from: appsetup.yaml

- name: nodejs setup
  ansible.builtin.import_role:
    name: common 
    tasks_from: nodejs.yaml

- name: sysytemd setup
  ansible.builtin.import_role:
    name: common 
    tasks_from: systemd.yaml



- name:  start cart
  ansible.builtin.service:
    name: cart
    state: restarted
    enabled: yes