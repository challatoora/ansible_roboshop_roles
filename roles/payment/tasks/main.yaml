- name: app setup
  ansible.builtin.import_role:
    name: common 
    tasks_from: appsetup.yaml


- name: python setup
  ansible.builtin.import_role:
    name: common 
    tasks_from: pythonsetup.yaml


- name: systemd setup
  ansible.builtin.import_role:
    name: common 
    tasks_from: systemd.yaml


- name: statrt and enable service
  ansible.builtin.service:
      name: payment
      state: restarted
      enabled: yes